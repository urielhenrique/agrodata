[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrodata"
version = "0.1.0"
description = "Plataforma de engenharia de dados geoespaciais aplicada ao agronegócio"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "AgroData" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"